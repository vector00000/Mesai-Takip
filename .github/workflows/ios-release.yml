name: Build Mesai Takip iOS & Publish Direct Download Links (APK + iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios-and-release:
    name: Build Real iOS IPA & Publish Release (IPA + APK)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode 15 Compatible Project
        working-directory: iosApp
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' MesaiTakip.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/g' MesaiTakip.xcodeproj/project.pbxproj

      - name: Build Real Native iOS Release App Bundle
        working-directory: iosApp
        run: |
          xcodebuild clean build \
            -project MesaiTakip.xcodeproj \
            -scheme MesaiTakip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package Real iOS IPA File (MesaiTakip-iOS-v31.ipa)
        working-directory: iosApp
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/MesaiTakip.app build/ipa/Payload/
          cd build/ipa
          zip -r -q ../../MesaiTakip-iOS-v31.ipa Payload
          cp ../../MesaiTakip-iOS-v31.ipa ../../../MesaiTakip-iOS-v31.ipa
          ls -lh ../../../MesaiTakip-iOS-v31.ipa

      - name: Prepare or Build Android APK (Mesai-Takip-Android-v31.apk)
        run: |
          if [ -f "app-release.apk" ]; then
            cp app-release.apk Mesai-Takip-Android-v31.apk
          elif [ -f "app-release-v30.apk" ]; then
            cp app-release-v30.apk Mesai-Takip-Android-v31.apk
          else
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/*.apk Mesai-Takip-Android-v31.apk
          fi
          ls -lh Mesai-Takip-Android-v31.apk

      - name: Publish Real Binary Downloads on GitHub Releases (v31.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v31.0
          name: "Mesai Takip v31.0 — Gerçek iOS (.IPA) ve Android (.APK) Kurulum Dosyaları"
          body: |
            ## 📲 Mesai Takip v31.0 — Doğrudan İndirme Linkleri
            Aşağıdaki **Assets** bölümünden gerçek kurulum paketlerini doğrudan indirebilirsiniz:
            - **🍎 Gerçek iOS Kurulum Paketi (.IPA):** `MesaiTakip-iOS-v31.ipa`
            - **🤖 Gerçek Android Kurulum Paketi (.APK):** `Mesai-Takip-Android-v31.apk`
          files: |
            MesaiTakip-iOS-v31.ipa
            Mesai-Takip-Android-v31.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (IPA & APK)
        uses: actions/upload-artifact@v4
        with:
          name: MesaiTakip-v31-IPA-ve-APK
          path: |
            MesaiTakip-iOS-v31.ipa
            Mesai-Takip-Android-v31.apk
          if-no-files-found: error
          retention-days: 30
