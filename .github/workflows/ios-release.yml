name: Build Mesai Takip iOS & Publish Direct Download Links (APK + iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ios-build-and-pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Publish Web & Download Page (GitHub Pages)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload iOS Web & Download Portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'iosWeb'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios-and-release:
    name: Build iOS IPA & Publish Downloadable Release (APK + iOS)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode 15 Compatible Project
        working-directory: iosApp
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' MesaiTakip.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/g' MesaiTakip.xcodeproj/project.pbxproj

      - name: Build iOS Release App Bundle
        working-directory: iosApp
        run: |
          xcodebuild clean build \
            -project MesaiTakip.xcodeproj \
            -scheme MesaiTakip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA File (MesaiTakip-iOS-v31.ipa)
        working-directory: iosApp
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/MesaiTakip.app build/ipa/Payload/
          cd build/ipa
          zip -r -q ../../MesaiTakip-iOS-v31.ipa Payload
          ls -lh ../../MesaiTakip-iOS-v31.ipa

      - name: Prepare Android APK & iOS Installer Files for Direct Download
        run: |
          cp app-release.apk Mesai-Takip-Android-v31.apk
          cp iosWeb/Mesai-Takip-iOS.mobileconfig Mesai-Takip-iOS.mobileconfig
          cp iosApp/MesaiTakip-iOS-v31.ipa MesaiTakip-iOS-v31.ipa

      - name: Publish Direct Download Links on GitHub Releases (v31.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v31.0
          name: "Mesai Takip v31.0 — Doğrudan İndirme (Android APK & iOS Kurulum Paketi)"
          body: |
            ## 📲 Mesai Takip v31.0 — Tek Tıkla Telefonunuza İndirin
            Aşağıdaki **Assets** bölümünden telefonunuza uygun dosyaya tıklayarak doğrudan indirebilirsiniz:
            - **🤖 Android Telefonlar İçin APK:** `Mesai-Takip-Android-v31.apk`
            - **🍎 iPhone / iPad (iOS) Kurulum Paketi:** `Mesai-Takip-iOS.mobileconfig` *(İndirip Ayarlar -> Profil İndirildi -> Yükle diyerek ana ekranınıza kurun)*
            - **📦 iOS .IPA Paketi:** `MesaiTakip-iOS-v31.ipa`
          files: |
            Mesai-Takip-Android-v31.apk
            Mesai-Takip-iOS.mobileconfig
            MesaiTakip-iOS-v31.ipa
            MesaiTakip-iOS-AppStore-Gorselleri.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MesaiTakip iOS IPA & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MesaiTakip-Indirme-Paketi-APK-ve-iOS
          path: |
            Mesai-Takip-Android-v31.apk
            Mesai-Takip-iOS.mobileconfig
            MesaiTakip-iOS-v31.ipa
            MesaiTakip-iOS-AppStore-Gorselleri.zip
          if-no-files-found: error
          retention-days: 30
