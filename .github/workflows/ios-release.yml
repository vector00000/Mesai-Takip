name: Build Mesai Takip (Windows Store MSIX + iOS IPA + Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-windows-msix:
    name: Build Microsoft Store MSIX Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile MesaiTakip.exe & Package Microsoft Store MSIX
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          mkdir -Force windows_pkg\Assets
          Copy-Item "windowsApp\Assets\*" "windows_pkg\Assets\" -Recurse -Force
          Copy-Item "windowsApp\index.html" "windows_pkg\index.html" -Force
          Copy-Item "windowsApp\manifest.json" "windows_pkg\manifest.json" -Force
          Copy-Item "windowsApp\sw.js" "windows_pkg\sw.js" -Force
          Copy-Item "windowsApp\support.html" "windows_pkg\support.html" -Force

          # Compile Windows Executable (AnyCPU / neutral)
          & $csc /target:winexe /out:windows_pkg\MesaiTakip.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll windowsApp\Program.cs

          # Copy AppxManifest.xml
          Copy-Item "windowsApp\AppxManifest.xml" "windows_pkg\AppxManifest.xml" -Force

          # Locate MakeAppx.exe from Windows 10/11 SDK
          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using MakeAppx: $makeappx"

          & $makeappx pack /d windows_pkg /p MesaiTakip-WindowsStore-v31.msix /nv /o
          dir MesaiTakip-WindowsStore-v31.msix

      - name: Upload Microsoft Store MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MesaiTakip-MicrosoftStore-MSIX-Paketi
          path: MesaiTakip-WindowsStore-v31.msix
          if-no-files-found: error
          retention-days: 30

      - name: Publish MSIX to GitHub Releases (v31.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v31.0
          name: "Mesai Takip v31.0 — Microsoft Store (.MSIX), iOS (.IPA) ve Android (.APK)"
          files: |
            MesaiTakip-WindowsStore-v31.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios-and-release:
    name: Build Real iOS IPA & Publish Release (IPA + APK)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode 15 Compatible Project
        working-directory: iosApp
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' MesaiTakip.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/g' MesaiTakip.xcodeproj/project.pbxproj

      - name: Build Real Native iOS Release App Bundle
        working-directory: iosApp
        run: |
          xcodebuild clean build \
            -project MesaiTakip.xcodeproj \
            -scheme MesaiTakip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package Real iOS IPA File (MesaiTakip-iOS-v31.ipa)
        working-directory: iosApp
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/MesaiTakip.app build/ipa/Payload/
          cd build/ipa
          zip -r -q ../../MesaiTakip-iOS-v31.ipa Payload
          cp ../../MesaiTakip-iOS-v31.ipa ../../../MesaiTakip-iOS-v31.ipa
          ls -lh ../../../MesaiTakip-iOS-v31.ipa

      - name: Prepare or Build Android APK (Mesai-Takip-Android-v31.apk)
        run: |
          if [ -f "app-release.apk" ]; then
            cp app-release.apk Mesai-Takip-Android-v31.apk
          elif [ -f "app-release-v30.apk" ]; then
            cp app-release-v30.apk Mesai-Takip-Android-v31.apk
          else
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/*.apk Mesai-Takip-Android-v31.apk
          fi
          ls -lh Mesai-Takip-Android-v31.apk

      - name: Publish Real Binary Downloads on GitHub Releases (v31.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v31.0
          name: "Mesai Takip v31.0 — Microsoft Store (.MSIX), iOS (.IPA) ve Android (.APK)"
          body: |
            ## 📲 Mesai Takip v31.0 — Doğrudan İndirme Linkleri
            Aşağıdaki **Assets** bölümünden gerçek kurulum paketlerini doğrudan indirebilirsiniz:
            - **🪟 Microsoft Store Kurulum Paketi (.MSIX):** `MesaiTakip-WindowsStore-v31.msix`
            - **🍎 Gerçek iOS Kurulum Paketi (.IPA):** `MesaiTakip-iOS-v31.ipa`
            - **🤖 Gerçek Android Kurulum Paketi (.APK):** `Mesai-Takip-Android-v31.apk`
          files: |
            MesaiTakip-iOS-v31.ipa
            Mesai-Takip-Android-v31.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (IPA & APK)
        uses: actions/upload-artifact@v4
        with:
          name: MesaiTakip-v31-IPA-ve-APK
          path: |
            MesaiTakip-iOS-v31.ipa
            Mesai-Takip-Android-v31.apk
          if-no-files-found: error
          retention-days: 30
